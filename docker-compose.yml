services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taphoadeal-app
    env_file:
      - .env.production
    expose:
      - "3001"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: taphoadeal-nginx
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
